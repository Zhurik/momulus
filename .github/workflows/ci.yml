name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets you rebuild and publish images without pushing a commit.
  workflow_dispatch:

# A new push to the same branch cancels the previous run; main is never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  # Needed only when pushing to GitHub Container Registry with GITHUB_TOKEN.
  packages: write

env:
  CARGO_TERM_COLOR: always
  # Note: no global RUSTFLAGS=-D warnings — that would also deny warnings inside
  # third-party crates and break the build for reasons outside this repo.
  # Warnings are enforced where they belong, in the clippy step below.

jobs:
  test:
    name: Tests and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Docker- and pi-dependent tests are #[ignore]d and stay out of this run;
      # see the recommendations in the README for a separate integration job.
      - name: Tests
        run: cargo test --all-features --locked

      # Cheap guard: a broken compose file is easy to miss locally.
      - name: Validate docker-compose.yml
        env:
          LLM_API_KEY: dummy-for-validation
        run: docker compose config --quiet

  images:
    name: Images
    runs-on: ubuntu-latest
    # No point building images if the code does not compile.
    needs: test
    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # Registry settings. Everything here is a placeholder: set the variables
      # and secrets in the repository settings and the push turns itself on.
      #
      #   Settings -> Secrets and variables -> Actions
      #     Variables: REGISTRY          (e.g. ghcr.io, docker.io, registry.example.com)
      #                IMAGE_NAMESPACE   (e.g. your org, user or project path)
      #     Secrets:   REGISTRY_USERNAME
      #                REGISTRY_TOKEN
      #
      # For GHCR you can skip the secrets entirely: set REGISTRY=ghcr.io and use
      # github.actor + secrets.GITHUB_TOKEN below (already wired as a fallback).
      # ---------------------------------------------------------------------
      - name: Resolve registry settings
        id: registry
        env:
          REGISTRY: ${{ vars.REGISTRY }}
          IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          registry="${REGISTRY:-ghcr.io}"
          namespace="${IMAGE_NAMESPACE:-}"
          # ghcr.io always needs an owner segment; a private registry often takes
          # the image straight at its root, so an empty namespace stays empty.
          if [ -z "$namespace" ] && [ "$registry" = "ghcr.io" ]; then
            namespace="${{ github.repository_owner }}"
          fi
          prefix="$registry"
          if [ -n "$namespace" ]; then
            prefix="$registry/$(echo "$namespace" | tr '[:upper:]' '[:lower:]')"
          fi
          # Publish only from main, and only once credentials exist. Until then
          # the images are still built here, so a broken Dockerfile fails the run.
          push=false
          if [ "${{ github.ref }}" = "refs/heads/main" ] \
            && { [ -n "$REGISTRY_TOKEN" ] || [ "$registry" = "ghcr.io" ]; }; then
            push=true
          fi
          {
            echo "registry=$registry"
            echo "image_prefix=$prefix"
            echo "push=$push"
          } >> "$GITHUB_OUTPUT"
          echo "images will be $prefix/momulus and $prefix/momulus-runner (push=$push)"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        if: steps.registry.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.registry }}
          # Falls back to the built-in token, which is enough for ghcr.io.
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Tags for the service image
        id: meta_service
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.registry.outputs.image_prefix }}/momulus
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build the service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ steps.registry.outputs.push == 'true' }}
          # When not pushing, hand the image to the local daemon so the smoke
          # test below can run it without building anything twice.
          load: ${{ steps.registry.outputs.push != 'true' }}
          tags: ${{ steps.meta_service.outputs.tags }}
          labels: ${{ steps.meta_service.outputs.labels }}
          cache-from: type=gha,scope=service
          cache-to: type=gha,scope=service,mode=max

      - name: Tags for the runner image
        id: meta_runner
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.registry.outputs.image_prefix }}/momulus-runner
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build the runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.runner
          push: ${{ steps.registry.outputs.push == 'true' }}
          load: ${{ steps.registry.outputs.push != 'true' }}
          # Keep the pi version pinned the same way the Dockerfile does.
          build-args: |
            PI_VERSION=0.87.1
          tags: ${{ steps.meta_runner.outputs.tags }}
          labels: ${{ steps.meta_runner.outputs.labels }}
          cache-from: type=gha,scope=runner
          cache-to: type=gha,scope=runner,mode=max

      # Both images were loaded into the local daemon above, so this costs seconds.
      - name: Smoke-test the built images
        if: steps.registry.outputs.push != 'true'
        env:
          SERVICE_TAGS: ${{ steps.meta_service.outputs.tags }}
          RUNNER_TAGS: ${{ steps.meta_runner.outputs.tags }}
        run: |
          service=$(echo "$SERVICE_TAGS" | head -1)
          runner=$(echo "$RUNNER_TAGS" | head -1)
          docker run --rm "$service" --version
          docker run --rm "$service" skills --skills-dir /nonexistent list && exit 1 || true
          docker run --rm "$runner" pi --version
