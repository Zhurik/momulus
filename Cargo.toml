[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/skills",
    "crates/workspace",
    "crates/pipeline",
    "crates/runner-docker",
    "crates/github",
    "crates/queue",
    "crates/momulus",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
momulus-core = { path = "crates/core" }
momulus-skills = { path = "crates/skills" }
momulus-workspace = { path = "crates/workspace" }
momulus-queue = { path = "crates/queue" }
momulus-pipeline = { path = "crates/pipeline" }
momulus-runner-docker = { path = "crates/runner-docker" }
momulus-github = { path = "crates/github" }

anyhow = "1.0.104"
async-trait = "0.1.92"
bollard = "0.21.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
globset = "0.4.20"
humantime-serde = "1.1.1"
jsonwebtoken = "10.3"
octocrab = "0.54.2"
rand = "0.10.3"
schemars = "1.2.2"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "sqlite", "macros", "migrate", "chrono"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }

assert_cmd = "2.2.2"
insta = { version = "1.48.0", features = ["json", "redactions"] }
predicates = "3"
tempfile = "3.27.0"
wiremock = "0.6.5"

[profile.release]
strip = true
