# Пример конфигурации llm-bot. Секреты сюда не кладём — они приходят из окружения:
#   GITHUB_APP_ID, GITHUB_APP_PRIVATE_KEY_PATH, LLM_API_KEY, LLM_BASE_URL.

# Как часто опрашиваем GitHub на новые команды.
poll_interval = "45s"

# Сколько джоб выполняем одновременно.
concurrency = 1

# Кому разрешено запускать команды. Остальные комментарии игнорируются молча.
allowed_users = ["zhurik"]

# Необязательный белый список репозиториев. Пусто — все репозитории установки App.
repos = []

# Данные сервиса: SQLite, кэш репозиториев, worktree, логи джоб.
# В docker-compose путь должен совпадать с хостовым (см. README): демон монтирует
# рабочую копию в контейнер с pi и понимает только хостовые пути.
data_dir = "/srv/llm-bot/data"

# Каталог со скиллами (SKILL.md + skill.toml). Тоже монтируется в контейнер.
skills_dir = "/srv/llm-bot/skills"

# Сколько ждём завершения текущих джоб при остановке.
shutdown_timeout = "5m"

[llm]
# Провайдер и модель по умолчанию, передаются pi. Скилл может переопределить модель.
# Здесь — OpenAI-совместимый шлюз Cloud.ru Foundation Models с GLM-5.1.
default_provider = "cloudru"
default_model = "zai-org/GLM-5.1"

# Протокол провайдера. Задавать нужно только для провайдеров, которых нет среди
# встроенных в pi: тогда llm-bot опишет его в models.json контейнера, а base URL
# возьмёт из LLM_BASE_URL (для Cloud.ru — https://foundation-models.api.cloud.ru/v1).
# Для встроенного провайдера (anthropic, openai, google, ...) поле нужно убрать.
api = "openai-completions"

# Имя переменной окружения, в которой pi ждёт ключ.
# Пусто — выводится из имени провайдера: cloudru -> CLOUDRU_API_KEY.
# api_key_env = "CLOUDRU_API_KEY"

[docker]
runner_image = "llm-bot-runner:latest"
cpu = 2.0
memory_mb = 2048
# host = "unix:///var/run/docker.sock"
# Пользователь внутри контейнера с pi. Нужен, если uid сервиса на хосте
# не совпадает с uid в образе: иначе pi не сможет писать в /out.
# user = "1000:1000"

[github]
api_base = "https://api.github.com"
bot_name = "llm-bot"
bot_email = "llm-bot@users.noreply.github.com"

[limits]
# Слишком большой PR — отказ с комментарием, без вызова LLM.
max_diff_bytes = 400000
max_file_bytes = 200000
max_changed_files = 100
