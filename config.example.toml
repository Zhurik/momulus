# Example momulus configuration. Secrets do not belong here — they come from the
# environment: GITHUB_APP_ID, GITHUB_APP_PRIVATE_KEY_PATH, LLM_API_KEY, LLM_BASE_URL.

# How often we poll GitHub for new commands.
poll_interval = "45s"

# How many jobs run at the same time.
concurrency = 1

# Who may issue commands. Comments from anyone else are ignored silently.
allowed_users = ["your-github-login"]

# Optional repository allowlist. Empty means every repository of the installation.
repos = []

# Service data: SQLite, the repository cache, worktrees and job logs.
# Under docker-compose this path must match the host path (see README): the daemon
# mounts the working copy into the pi container and only understands host paths.
data_dir = "/srv/momulus/data"

# Skills directory (SKILL.md + skill.toml). It is mounted into the container too.
skills_dir = "/srv/momulus/skills"

# How long we wait for running jobs on shutdown.
shutdown_timeout = "5m"

[llm]
# Default provider and model, both passed to pi. A skill may override the model.
# "openai" is built into pi, so no base URL is required.
default_provider = "openai"
default_model = "gpt-5.1"

# Provider protocol. Only needed for providers pi does not know about: momulus
# then describes them in the container's models.json and takes the endpoint from
# LLM_BASE_URL. For a built-in provider (openai, anthropic, google, ...) leave it out.
# api = "openai-completions"

# Name of the environment variable pi reads the key from.
# Empty means it is derived from the provider name: openai -> OPENAI_API_KEY.
# api_key_env = "OPENAI_API_KEY"

[docker]
runner_image = "momulus-runner:latest"
cpu = 2.0
memory_mb = 2048
# host = "unix:///var/run/docker.sock"
# User inside the pi container. Needed when the service uid on the host differs
# from the uid in the image: otherwise pi cannot write to /out.
# user = "1000:1000"

[github]
api_base = "https://api.github.com"
bot_name = "momulus"
bot_email = "momulus@users.noreply.github.com"

[limits]
# An oversized PR is refused with a comment, without calling the model.
max_diff_bytes = 400000
max_file_bytes = 200000
max_changed_files = 100
