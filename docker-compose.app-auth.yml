# Overlay for GitHub App authentication instead of a personal access token.
#
#   docker compose -f docker-compose.yml -f docker-compose.app-auth.yml up -d
#
# Expects the App private key at ${MOMULUS_ROOT}/secrets/github-app.pem and
# GITHUB_APP_ID in .env. With a token this file is not needed at all.

services:
  momulus:
    volumes:
      - ${MOMULUS_ROOT:-${PWD}}/secrets/github-app.pem:/run/secrets/github-app.pem:ro
    environment:
      GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github-app.pem
