mode = "patch"
tools = ["read", "write", "edit", "grep", "find", "ls"]
files = ["**/*.md", "**/*.mdx"]
args = ["lang"]
timeout = "20m"
model = ""
branch = "llm/{skill}-{lang}-{pr}"

[vars]
# Naming convention for the translated file. {dir} is the original's directory,
# {stem} the file name without extension and without a language code, {lang} the
# target language, {ext} the extension:
#   content/posts/dns/index.ru.md + lang=en -> content/posts/dns/index.en.md
#   posts/hello.mdx               + lang=en -> posts/hello.en.mdx
naming = "{dir}/{stem}.{lang}{ext}"
