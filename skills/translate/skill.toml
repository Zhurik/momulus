mode = "patch"
tools = ["read", "write", "edit", "grep", "find", "ls"]
files = ["**/*.md", "**/*.mdx"]
args = ["lang"]
timeout = "20m"
model = ""
branch = "llm/{skill}-{lang}-{pr}"

[vars]
# Конвенция имени файла перевода. {dir} — каталог оригинала, {stem} — имя без
# расширения и без кода языка, {lang} — целевой язык, {ext} — расширение:
#   content/posts/dns/index.ru.md + lang=en -> content/posts/dns/index.en.md
#   posts/hello.mdx               + lang=en -> posts/hello.en.mdx
naming = "{dir}/{stem}.{lang}{ext}"
