# Contract for the orchestrator. Instructions for the model live in SKILL.md.
mode = "review"
# write is needed to produce /out/findings.json; the working copy is mounted
# read-only, so the agent cannot write into it anyway.
tools = ["read", "grep", "find", "ls", "write"]
files = ["**/*.md", "**/*.mdx"]
args = []
timeout = "10m"
model = ""
max_comments = 30
