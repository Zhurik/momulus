# Контракт для оркестратора. Инструкции для модели — в SKILL.md.
mode = "review"
# write нужен, чтобы записать /out/findings.json; рабочая копия смонтирована
# только для чтения, так что писать в неё агент всё равно не может.
tools = ["read", "grep", "find", "ls", "write"]
files = ["**/*.md", "**/*.mdx"]
args = []
timeout = "10m"
model = ""
max_comments = 30
