# Разворачивание llm-bot на одной машине.
#
# Пути на хосте и в контейнере СОВПАДАЮТ намеренно: сервис просит docker-демон
# смонтировать рабочую копию в контейнер с pi, а демон живёт на хосте и видит
# только хостовые пути. Поэтому data_dir и skills_dir задаются абсолютными
# путями и монтируются «сами в себя».
#
# Перед первым запуском:
#   export LLM_BOT_ROOT=/srv/llm-bot         # где лежат data/, skills/, config.toml
#   mkdir -p $LLM_BOT_ROOT/{data,secrets}
#   cp config.example.toml $LLM_BOT_ROOT/config.toml
#   cp -r skills $LLM_BOT_ROOT/skills
#   cp ~/github-app.private-key.pem $LLM_BOT_ROOT/secrets/github-app.pem
#   docker compose --profile build build     # собрать образ раннера с pi
#   docker compose up -d

x-root: &root ${LLM_BOT_ROOT:-/srv/llm-bot}

services:
  llm-bot:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: llm-bot:latest
    restart: unless-stopped
    # Нужен доступ к docker-демону: сервис запускает контейнеры с pi на каждую
    # джобу. Это фактически права root на хосте — в README описан вариант
    # с docker-socket-proxy, который сужает набор разрешённых эндпоинтов.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${LLM_BOT_ROOT:-/srv/llm-bot}/data:${LLM_BOT_ROOT:-/srv/llm-bot}/data
      - ${LLM_BOT_ROOT:-/srv/llm-bot}/skills:${LLM_BOT_ROOT:-/srv/llm-bot}/skills:ro
      - ${LLM_BOT_ROOT:-/srv/llm-bot}/config.toml:/etc/llm-bot/config.toml:ro
    secrets:
      - github_app_key
    environment:
      LLM_BOT_CONFIG: /etc/llm-bot/config.toml
      GITHUB_APP_ID: ${GITHUB_APP_ID:?нужен id GitHub App}
      GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github_app_key
      LLM_API_KEY: ${LLM_API_KEY:?нужен ключ LLM-провайдера}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://foundation-models.api.cloud.ru/v1}
      RUST_LOG: ${RUST_LOG:-info}
    command: ["serve", "--log-format", "json"]
    # Сервис держит только SQLite и git: 512 МБ хватает, память нужна раннеру.
    mem_limit: 512m
    cpus: 1.0

  # Сборка образа с pi. Не запускается: `docker compose --profile build build`.
  runner-image:
    build:
      context: .
      dockerfile: docker/Dockerfile.runner
      args:
        PI_VERSION: ${PI_VERSION:-0.87.1}
    image: llm-bot-runner:latest
    profiles: ["build"]
    command: ["pi", "--version"]

secrets:
  github_app_key:
    file: ${LLM_BOT_ROOT:-/srv/llm-bot}/secrets/github-app.pem
