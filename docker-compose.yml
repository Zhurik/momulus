# Deploying momulus on a single machine.
#
# Host and container paths are identical on purpose: the service asks the docker
# daemon to mount the working copy into the pi container, and the daemon lives on
# the host and only sees host paths. That is why data_dir and skills_dir are
# absolute and mounted onto themselves.
#
# Before the first run:
#   export MOMULUS_ROOT=/srv/momulus          # holds data/, skills/, config.toml
#   mkdir -p $MOMULUS_ROOT/{data,secrets}
#   cp config.example.toml $MOMULUS_ROOT/config.toml
#   cp -r skills $MOMULUS_ROOT/skills
#   cp ~/github-app.private-key.pem $MOMULUS_ROOT/secrets/github-app.pem
#   docker compose --profile build build      # build the pi runner image
#   docker compose up -d

services:
  momulus:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: momulus:latest
    restart: unless-stopped
    # Needs access to the docker daemon: the service starts one pi container per
    # job. That is effectively root on the host — the README describes the
    # docker-socket-proxy variant, which narrows the allowed endpoints down.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${MOMULUS_ROOT:-/srv/momulus}/data:${MOMULUS_ROOT:-/srv/momulus}/data
      - ${MOMULUS_ROOT:-/srv/momulus}/skills:${MOMULUS_ROOT:-/srv/momulus}/skills:ro
      - ${MOMULUS_ROOT:-/srv/momulus}/config.toml:/etc/momulus/config.toml:ro
    secrets:
      - github_app_key
    environment:
      MOMULUS_CONFIG: /etc/momulus/config.toml
      GITHUB_APP_ID: ${GITHUB_APP_ID:?the GitHub App id is required}
      GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github_app_key
      LLM_API_KEY: ${LLM_API_KEY:?the LLM provider key is required}
      # Only needed for an OpenAI-compatible gateway; leave unset for a provider
      # pi already knows (openai, anthropic, google, ...).
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      RUST_LOG: ${RUST_LOG:-info}
    command: ["serve", "--log-format", "json"]
    # The service only holds SQLite and git: 512 MB is plenty, the runner is the
    # one that needs memory.
    mem_limit: 512m
    cpus: 1.0

  # Builds the image with pi. Never started: `docker compose --profile build build`.
  runner-image:
    build:
      context: .
      dockerfile: docker/Dockerfile.runner
      args:
        PI_VERSION: ${PI_VERSION:-0.87.1}
    image: momulus-runner:latest
    profiles: ["build"]
    command: ["pi", "--version"]

secrets:
  github_app_key:
    file: ${MOMULUS_ROOT:-/srv/momulus}/secrets/github-app.pem
